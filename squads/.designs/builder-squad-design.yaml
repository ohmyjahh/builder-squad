    - { name: create-project-closure, agent: documentation-handoff-specialist, entrada: [release_evidence, decisions, open_items], saida: [closure_report], confidence: 0.98 }

  workflows:
    - { name: wf-intake-and-classify, entry: builder-chief, purpose: all }
    - { name: wf-internal-tool, entry: builder-chief, purpose: internal }
    - { name: wf-market-product, entry: builder-chief, purpose: market }
    - { name: wf-hybrid-evolution, entry: builder-chief, purpose: hybrid }
    - { name: wf-client-delivery, entry: builder-chief, purpose: client }
    - { name: wf-agent-and-automation, entry: builder-chief, purpose: ai-automation }
    - { name: wf-brownfield-improvement, entry: builder-chief, purpose: brownfield }
    - { name: wf-bug-and-recovery, entry: builder-chief, purpose: incident }
    - { name: wf-security-review, entry: security-reviewer, purpose: security }
    - { name: wf-release, entry: devops-release-engineer, purpose: release }
    - { name: wf-growth-iteration, entry: growth-sales-strategist, purpose: growth }
    - { name: wf-project-resume, entry: builder-chief, purpose: resume }

  template: custom
  config_mode: extend

metadata:
  created_at: "2026-09-11T00:00:00-03:00"
  source_docs:
    - docs/prd/PRODUCT-REQUIREMENTS.md
    - docs/architecture/SYSTEM-ARCHITECTURE.md
    - docs/roadmap/MASTER-PLAN.md
  user_adjustments: 2
  overall_confidence: 0.96
  decisions:
    - O intake deve perguntar se o projeto é interno ou para o mercado.
    - O produto será complexo, completo, proprietário e salvo em repositório privado.
