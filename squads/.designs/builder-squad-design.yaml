    - { name: review-story-readiness, agent: qa-engineer, entrada: [story, dependencies], saida: [readiness_verdict], confidence: 0.99 }
    - { name: execute-quality-gate, agent: qa-engineer, entrada: [artifacts, checklist], saida: [qa_report, verdict], confidence: 0.99 }
    - { name: verify-regression, agent: qa-engineer, entrada: [changes, regression_suite], saida: [regression_evidence], confidence: 0.99 }

    - { name: create-threat-model, agent: security-reviewer, entrada: [architecture, data_flows], saida: [threat_model], confidence: 0.99 }
    - { name: review-application-security, agent: security-reviewer, entrada: [implementation, threat_model], saida: [security_report], confidence: 0.99 }
    - { name: review-privacy-and-data, agent: security-reviewer, entrada: [data_model, policies], saida: [privacy_report], confidence: 0.98 }
    - { name: issue-security-verdict, agent: security-reviewer, entrada: [security_report, risk_acceptance], saida: [security_verdict], confidence: 0.99 }

    - { name: create-release-plan, agent: devops-release-engineer, entrada: [release_candidate, architecture], saida: [release_plan], confidence: 0.98 }
    - { name: configure-delivery-pipeline, agent: devops-release-engineer, entrada: [release_plan, environment], saida: [pipeline_changes], confidence: 0.97 }
    - { name: execute-approved-deploy, agent: devops-release-engineer, entrada: [approval, release_candidate], saida: [deployment_evidence], confidence: 0.99 }
    - { name: execute-rollback, agent: devops-release-engineer, entrada: [rollback_approval, incident], saida: [rollback_evidence], confidence: 0.99 }
    - { name: verify-production, agent: devops-release-engineer, entrada: [deployment_evidence, smoke_tests], saida: [production_verdict], confidence: 0.99 }

    - { name: design-market-offer, agent: growth-sales-strategist, entrada: [value_proposition, market_evidence], saida: [offer], confidence: 0.96 }
    - { name: define-pricing-hypothesis, agent: growth-sales-strategist, entrada: [offer, economics], saida: [pricing_hypothesis], confidence: 0.94 }
    - { name: create-go-to-market-plan, agent: growth-sales-strategist, entrada: [offer, icp, constraints], saida: [gtm_plan], confidence: 0.96 }
