name: builder-squad
version: "0.1.0"
short-title: "Builder Squad"
description: >-
  Sistema multiagente task-first para diagnosticar, planejar, construir, validar
  e preparar para operação ou mercado apps, sistemas, agentes e automações.
author: "Rafa"
license: UNLICENSED
slashPrefix: builder

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - ai-builder
  - product-development
  - orchestration
  - task-first
  - vibe-coding
  - agents
  - automation
  - proprietary

