name: builder-squad
version: "0.1.0"
short-title: "Builder Squad"
description: >-
  Sistema multiagente task-first para diagnosticar, planejar, construir, validar
  e preparar para operação ou mercado apps, sistemas, agentes e automações.
author: "Rafa"
license: UNLICENSED
slashPrefix: builder

aios:
  minVersion: "4.0.0"
  type: squad

tags:
  - ai-builder
  - product-development
  - orchestration
  - task-first
  - vibe-coding
  - agents
  - automation
  - proprietary

components:
  agents:
    - builder-chief.md
    - product-strategist.md
    - process-analyst.md
    - project-manager.md
    - solution-architect.md
    - ux-ui-designer.md
    - data-architect.md
    - backend-engineer.md
    - frontend-engineer.md
    - agent-architect.md
    - automation-integration-engineer.md
    - qa-engineer.md
    - security-reviewer.md
    - devops-release-engineer.md
    - growth-sales-strategist.md
    - documentation-handoff-specialist.md
  tasks:
    - start-project.md
    - classify-project.md
    - create-canonical-brief.md
    - route-project.md
    - report-project-status.md
    - resume-project.md
    - correct-course.md
    - close-project.md
    - validate-market-problem.md
    - define-ideal-customer.md
    - define-value-proposition.md
    - scope-market-mvp.md
    - define-monetization.md
    - map-current-process.md
    - design-future-process.md
    - calculate-internal-roi.md
    - plan-internal-adoption.md
    - create-project-plan.md
    - decompose-into-stories.md
    - decompose-into-tasks.md
    - identify-critical-path.md
    - create-risk-register.md
    - select-technical-stack.md
    - design-system-architecture.md
    - define-nonfunctional-requirements.md
    - define-service-contracts.md
    - record-architecture-decision.md
    - map-user-journey.md
    - design-user-flows.md
    - create-interface-specification.md
    - define-design-tokens.md
    - review-usability-accessibility.md
    - model-domain-data.md
    - design-database-schema.md
    - define-data-access.md
    - plan-data-migration.md
    - review-data-integrity.md
    - plan-backend-implementation.md
    - implement-backend-service.md
    - implement-auth-and-permissions.md
    - test-backend.md
    - plan-frontend-implementation.md
    - implement-user-interface.md
    - integrate-frontend-services.md
    - test-frontend.md
    - design-ai-agent.md
    - define-agent-context-and-tools.md
    - create-agent-evaluation-suite.md
    - review-agent-behavior.md
    - map-integration.md
    - design-automation.md
    - implement-integration.md
    - test-integration-resilience.md
    - create-test-strategy.md
    - review-story-readiness.md
    - execute-quality-gate.md
    - verify-regression.md
    - create-threat-model.md
    - review-application-security.md
    - review-privacy-and-data.md
    - issue-security-verdict.md
    - create-release-plan.md
    - configure-delivery-pipeline.md
    - execute-approved-deploy.md
    - execute-rollback.md
    - verify-production.md
    - design-market-offer.md
    - define-pricing-hypothesis.md
    - create-go-to-market-plan.md
    - define-product-analytics.md
    - review-growth-cycle.md
    - create-user-guide.md
    - create-operational-runbook.md
    - prepare-client-handoff.md
    - create-project-closure.md
  workflows:
    - wf-intake-and-classify.yaml
    - wf-internal-tool.yaml
    - wf-market-product.yaml
    - wf-hybrid-evolution.yaml
    - wf-client-delivery.yaml
    - wf-agent-and-automation.yaml
    - wf-brownfield-improvement.yaml
    - wf-bug-and-recovery.yaml
    - wf-security-review.yaml
    - wf-release.yaml
    - wf-growth-iteration.yaml
    - wf-project-resume.yaml
  checklists:
    - intake-completeness.md
    - handoff-quality.md
    - orchestration-quality.md
  templates:
    - intake-questionnaire.md
    - canonical-brief.md
    - handoff.md
    - decision-record.md
    - task-contract.md
  data:
    - project-ontology.yaml
    - routing-catalog.yaml
    - state-machine.yaml

config:
  extends: none
  runtime: config/config.yaml

distribution:
  visibility: private
  commercial: true
  adapters:
    - codex
    - claude-code

entrypoint:
  agent: builder-chief
  command: "*start-project"

governance:
  human_in_the_loop: true
  max_automatic_retries: 2
  verdicts:
    - PASS
    - CONCERNS
    - FAIL
    - BLOCKED
