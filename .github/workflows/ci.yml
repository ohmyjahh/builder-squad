name: Builder Squad CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: npm ci --ignore-scripts

      - name: Validate contracts
        run: npm run validate

      - name: Test
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in scripts/*.mjs scripts/lib/*.mjs tests/*.mjs; do
            node --check "$file"
          done

      - name: Build release package
        run: npm run package:squad

